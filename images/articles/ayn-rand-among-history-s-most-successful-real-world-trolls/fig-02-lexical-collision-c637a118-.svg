<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc">
<title id="title">Figure 02: Lexical collision chamber</title><desc id="desc">One word, selfishness, is interpreted as disregard for others by the general audience and rational self-interest within Rand's defined terminology. The collision generates repeatable dispute.</desc>
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#AAB8C6"/></marker></defs>
<rect width="1000" height="320" fill="#10151E"/><rect x="12" y="12" width="976" height="296" rx="12" fill="none" stroke="#344251"/>
<text x="36" y="40" fill="#AEBFCD" font-family="monospace" font-size="14" letter-spacing="2">FIG.02 / SEMANTIC INTERFACE COLLISION</text>
<rect x="36" y="70" width="365" height="130" rx="8" stroke="#E8A25A" stroke-width="2" fill="#34271C"/>
<text x="59" y="100" fill="#E8A25A" font-size="17" font-family="monospace">COMMON USAGE</text><text x="59" y="136" fill="#F3F5F6" font-size="26" font-weight="bold" font-family="sans-serif">“selfishness”</text><text x="59" y="169" fill="#CFD6E1" font-size="17" font-family="sans-serif">disregard for others</text>
<rect x="599" y="70" width="365" height="130" rx="8" stroke="#55C5FF" stroke-width="2" fill="#142B35"/>
<text x="622" y="100" fill="#55C5FF" font-size="17" font-family="monospace">STIPULATED USAGE</text><text x="622" y="136" fill="#F3F5F6" font-size="26" font-weight="bold" font-family="sans-serif">“selfishness”</text><text x="622" y="169" fill="#CFD6E1" font-size="17" font-family="sans-serif">rational self-interest</text>
<path d="M401 135 H457 M599 135 H543" stroke="#AAB8C6" stroke-width="3" marker-end="url(#arr)"/>
<circle cx="500" cy="135" r="41" fill="#412328" stroke="#F06E65" stroke-width="2.5"/>
<path d="M486 115 L514 155 M514 115 L486 155" stroke="#F6A59D" stroke-width="5"/>
<path d="M500 176 V219" fill="none" stroke="#F06E65" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="218" y="230" width="564" height="57" rx="8" fill="#291E2B" stroke="#F06E65"/>
<text x="500" y="255" fill="#F6A59D" font-family="monospace" font-size="19" text-anchor="middle">PREDICTABLE SEMANTIC DISPUTE</text>
<text x="500" y="275" fill="#D1D9E4" font-family="sans-serif" font-size="15" text-anchor="middle">Engagement begins before the underlying claim is evaluated</text>
