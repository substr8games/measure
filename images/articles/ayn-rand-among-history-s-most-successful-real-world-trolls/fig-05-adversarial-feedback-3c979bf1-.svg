<rect x="520" y="104" width="199" height="88" rx="8" fill="#17313A" stroke="#55C5FF" stroke-width="2"/><text x="619" y="137" text-anchor="middle" fill="#55C5FF" font-family="monospace" font-size="17">REINFORCEMENT</text><text x="619" y="163" text-anchor="middle" fill="#EDF1F8" font-family="sans-serif" font-size="17">In-group response</text>
