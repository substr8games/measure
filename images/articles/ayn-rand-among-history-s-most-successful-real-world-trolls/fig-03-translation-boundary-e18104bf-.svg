<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc">
<title id="title">Figure 03: Fiction to policy translation boundary</title><desc id="desc">A chain from fictional demonstration to moral classification to policy proposal crosses an empirical validation boundary requiring independent evidence.</desc>
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#AAB8C6"/></marker></defs>
<rect width="1000" height="320" fill="#10151E"/><rect x="12" y="12" width="976" height="296" rx="12" fill="none" stroke="#344251"/>
<text x="36" y="40" fill="#AEBFCD" font-family="monospace" font-size="14" letter-spacing="2">FIG.03 / TRANSLATION BOUNDARY</text>
<rect x="37" y="98" width="260" height="90" rx="7" fill="#271D32" stroke="#CB97FF" stroke-width="2"/><text x="167" y="130" text-anchor="middle" fill="#CB97FF" font-size="18" font-family="monospace">LITERARY CLAIM</text><text x="167" y="157" text-anchor="middle" fill="#F3F5F6" font-size="17" font-family="sans-serif">Fictional demonstration</text>
<path d="M298 143 H345" stroke="#AAB8C6" stroke-width="3" marker-end="url(#arr)"/>
<rect x="355" y="98" width="260" height="90" rx="7" fill="#142B35" stroke="#55C5FF" stroke-width="2"/><text x="485" y="130" text-anchor="middle" fill="#55C5FF" font-size="18" font-family="monospace">MORAL CLAIM</text><text x="485" y="157" text-anchor="middle" fill="#F3F5F6" font-size="17" font-family="sans-serif">Generalized principle</text>
<path d="M616 143 H681" stroke="#AAB8C6" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arr)"/>
<rect x="690" y="98" width="273" height="90" rx="7" fill="#173228" stroke="#4BEA91" stroke-width="2"/><text x="826" y="130" text-anchor="middle" fill="#4BEA91" font-size="18" font-family="monospace">POLICY CLAIM</text><text x="826" y="157" text-anchor="middle" fill="#F3F5F6" font-size="17" font-family="sans-serif">Institutional application</text>
<path d="M653 71 V216" stroke="#F06E65" stroke-width="3" stroke-dasharray="8 5"/><rect x="545" y="229" width="284" height="55" rx="5" fill="#3F2428" stroke="#F06E65"/>
<text x="687" y="251" text-anchor="middle" fill="#F6A59D" font-size="17" font-family="monospace">BOUNDARY CHECK</text><text x="687" y="272" text-anchor="middle" fill="#F0D6D4" font-size="15" font-family="sans-serif">Independent evidence required</text>
<text x="37" y="273" fill="#AEBFCD" font-family="sans-serif" font-size="15">Narrative certainty ≠ external validation</text>
</svg>