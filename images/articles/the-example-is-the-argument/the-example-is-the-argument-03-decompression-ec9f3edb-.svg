<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="470" viewBox="0 0 1160 470" role="img" aria-labelledby="title desc">
  <title id="title">Experiential decompression and structural transfer</title>
  <desc id="desc">The reader begins with the concrete history of a single case, reconstructs the relationships, builds a general structural pattern, then tests that pattern against a different case. Transfer is conditional on verifying the relevant correspondences.</desc>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#55C5FF" stroke-width="1.4"/></marker>
  </defs>
  <rect width="1160" height="470" fill="#000"/>
  <rect x="1" y="1" width="1158" height="468" fill="none" stroke="#33343C" stroke-width="2"/>
  <g font-family="Anonymouse,Hack,DejaVu Sans Mono,monospace">
    <text x="42" y="54" font-size="18" letter-spacing="2" fill="#CB97FF">FIG 03 / EXPERIENTIAL TRANSLATION</text>
    <text x="42" y="98" font-size="28" font-weight="700" fill="#F7F7F7">DECOMPRESS THE ABSTRACTION</text>
    <g transform="translate(42 151)">
      <rect width="235" height="158" fill="#0C1510" stroke="#4BEA91" stroke-width="2"/>
      <text x="14" y="29" font-size="18" font-weight="700" fill="#4BEA91">01 / CASE</text>
      <text x="14" y="72" font-size="20" fill="#FFFFFF">One history,</text>
      <text x="14" y="99" font-size="20" fill="#FFFFFF">observable</text>
      <text x="14" y="126" font-size="20" fill="#FFFFFF">consequences</text>
    </g>
    <g transform="translate(323 151)">
      <rect width="235" height="158" fill="#0A121A" stroke="#55C5FF" stroke-width="2"/>
      <text x="14" y="29" font-size="18" font-weight="700" fill="#55C5FF">02 / RELATIONS</text>
      <text x="14" y="72" font-size="20" fill="#FFFFFF">Actors, paths,</text>
      <text x="14" y="99" font-size="20" fill="#FFFFFF">incentives,</text>
      <text x="14" y="126" font-size="20" fill="#FFFFFF">transformations</text>
    </g>
    <g transform="translate(604 151)">
      <rect width="235" height="158" fill="#150F1B" stroke="#CB97FF" stroke-width="2"/>
      <text x="14" y="29" font-size="18" font-weight="700" fill="#CB97FF">03 / PATTERN</text>
      <text x="14" y="72" font-size="20" fill="#FFFFFF">A compressed</text>
      <text x="14" y="99" font-size="20" fill="#FFFFFF">structural</text>
      <text x="14" y="126" font-size="20" fill="#FFFFFF">explanation</text>
    </g>
    <g transform="translate(885 151)">
      <rect width="233" height="158" fill="#1A1208" stroke="#F4B568" stroke-width="2"/>
      <text x="14" y="29" font-size="18" font-weight="700" fill="#F4B568">04 / TEST</text>
      <text x="14" y="72" font-size="20" fill="#FFFFFF">A new case:</text>
      <text x="14" y="99" font-size="20" fill="#FFFFFF">do the same</text>
      <text x="14" y="126" font-size="20" fill="#FFFFFF">relations hold?</text>
    </g>
    <g stroke="#55C5FF" stroke-width="3" fill="none" marker-end="url(#a)">
      <path d="M280 230 H316"/>
      <path d="M561 230 H597"/>
      <path d="M842 230 H878"/>
    </g>
    <path d="M42 338 H1118" stroke="#34363D" stroke-width="2"/>
    <text x="42" y="380" font-size="19" fill="#F7F7F7">THE READER RECONSTRUCTS THE STRUCTURE BEFORE LEARNING ITS NAME.</text>
    <rect x="42" y="401" width="1076" height="41" fill="#121016" stroke="#CB97FF" stroke-width="1.5"/>
    <text x="59" y="428" font-size="17" fill="#CB97FF">TRANSFER REQUIRES VERIFIED RELATIONS; VISUAL SIMILARITY IS NOT EQUIVALENCE.</text>
  </g>
</svg>